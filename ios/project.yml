name: AFK-iOS
options:
  bundleIdPrefix: xyz.yuchenlin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: "6FQUWPKXD8"
    CODE_SIGN_STYLE: Automatic
targets:
  AFK:
    type: application
    platform: iOS
    sources:
      - path: AFK
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yuchenlin.afk.ios
        PRODUCT_NAME: AFK
        INFOPLIST_FILE: AFK/Info.plist
        CODE_SIGN_ENTITLEMENTS: AFK/AFK.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: AFK/AFK.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.yuchenlin.afk
        keychain-access-groups:
          - $(AppIdentifierPrefix)xyz.yuchenlin.afk.shared
    dependencies:
      - target: AFKKeyboard
        embed: true
    scheme:
      testTargets: []

  AFKKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: AFKKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yuchenlin.afk.ios.keyboard
        PRODUCT_NAME: AFKKeyboard
        INFOPLIST_FILE: AFKKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: AFKKeyboard/AFKKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: AFKKeyboard/AFKKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.yuchenlin.afk
        keychain-access-groups:
          - $(AppIdentifierPrefix)xyz.yuchenlin.afk.shared

schemes:
  AFK:
    build:
      targets:
        AFK: all
        AFKKeyboard: all
    run:
      config: Debug
