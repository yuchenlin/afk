name: AFK
options:
  bundleIdPrefix: xyz.yuchenlin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: macosx
  SWIFT_VERSION: "5.9"
packages:
  AFKCore:
    path: .
targets:
  AFK:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/AFK
        excludes:
          - Info.plist
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: xyz.yuchenlin.afk
      PRODUCT_NAME: AFK
      INFOPLIST_FILE: Apps/macOS/AFK/Info.plist
      LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      GENERATE_INFOPLIST_FILE: false
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: AFKCore
        product: AFKCore
    info:
      path: Apps/macOS/AFK/Info.plist
      properties:
        LSUIElement: true
